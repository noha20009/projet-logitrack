spring.application.name=projet-LogiTrack
spring.datasource.url=jdbc:mysql://localhost:3306/projetlogitrack
spring.datasource.username=root
spring.datasource.password=nouha23

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


app.frontend-url=http://localhost:5173

# Notification Service (OpenFeign)
notification.service.url=http://notification-service:8081

# OpenFeign + Resilience4j Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.notification-service.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.notification-service.timeout-duration=3s


spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=VOTRE_EMAIL@gmail.com
spring.mail.password=VOTRE_MOT_DE_PASSE_APPLICATION
spring.mail.from=VOTRE_EMAIL@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.tags.application=logitrack
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=0.1,0.5,1